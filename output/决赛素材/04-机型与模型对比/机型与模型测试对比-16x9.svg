<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF9F2"/>
      <stop offset="1" stop-color="#F5F0E9"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#392E27" flood-opacity="0.10"/>
    </filter>
    <style>
      .sans{font-family:"Microsoft YaHei","PingFang SC",sans-serif}
      .title{font-size:58px;font-weight:800;fill:#211C18}
      .sub{font-size:25px;fill:#756C65}
      .stage{font-size:18px;font-weight:700;letter-spacing:2px;fill:#F05A28}
      .device{font-size:31px;font-weight:800;fill:#211C18}
      .meta{font-size:20px;fill:#756C65}
      .label{font-size:17px;font-weight:700;fill:#9A8F87}
      .value{font-size:25px;font-weight:800;fill:#211C18}
      .copy{font-size:20px;fill:#504841}
      .metric{font-size:45px;font-weight:900;fill:#F05A28}
      .metric2{font-size:22px;font-weight:700;fill:#211C18}
      .foot{font-size:20px;fill:#756C65}
    </style>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <circle cx="1745" cy="-80" r="330" fill="#F05A28" opacity="0.07"/>
  <circle cx="90" cy="1060" r="260" fill="#E9A84B" opacity="0.08"/>

  <text class="sans stage" x="110" y="82">DEVICE × MODEL ADAPTATION</text>
  <text class="sans title" x="110" y="155">一套 Catune，适配不同性能的手机</text>
  <text class="sans sub" x="110" y="202">Qwen 提供多种端侧规格，MNN 根据设备能力选择模型与 CPU 路径</text>

  <g filter="url(#shadow)">
    <rect x="110" y="260" width="520" height="650" rx="34" fill="#FFFFFF"/>
    <rect x="700" y="260" width="520" height="650" rx="34" fill="#FFFFFF"/>
    <rect x="1290" y="260" width="520" height="650" rx="34" fill="#211C18"/>
  </g>

  <g class="sans">
    <rect x="145" y="298" width="94" height="34" rx="17" fill="#F4EFEA"/>
    <text class="stage" x="162" y="322" fill="#756C65">初赛 iOS</text>
    <text class="device" x="145" y="382">iPhone · Expo Go</text>
    <text class="meta" x="145" y="418">真实 DeviceMotion · 产品体验</text>
    <line x1="145" y1="455" x2="595" y2="455" stroke="#EEE7E1" stroke-width="2"/>
    <text class="label" x="145" y="500">运行形态</text>
    <text class="value" x="145" y="535">React Native / Expo</text>
    <text class="label" x="145" y="590">端侧模型</text>
    <text class="value" x="145" y="625">未接入原生 MNN</text>
    <text class="label" x="145" y="680">模型 TPS</text>
    <text class="metric" x="145" y="735" fill="#9A8F87">—</text>
    <rect x="145" y="785" width="450" height="88" rx="20" fill="#FAF7F4"/>
    <text class="copy" x="169" y="822">证明跨端体验与真实手机 IMU，</text>
    <text class="copy" x="169" y="852">不作为 iOS 端侧 Qwen 性能数据。</text>
  </g>

  <g class="sans">
    <rect x="735" y="298" width="132" height="34" rx="17" fill="#FFF0E8"/>
    <text class="stage" x="752" y="322">初赛 Android</text>
    <text class="device" x="735" y="382">小米 14 · 无 SME2</text>
    <text class="meta" x="735" y="418">arm64 原生 APK · 离线中文推理</text>
    <line x1="735" y1="455" x2="1185" y2="455" stroke="#EEE7E1" stroke-width="2"/>
    <text class="label" x="735" y="500">推荐模型</text>
    <text class="value" x="735" y="535">Qwen2.5-0.5B INT4</text>
    <text class="label" x="735" y="590">MNN 运行路径</text>
    <text class="value" x="735" y="625">CPU / NEON 回退</text>
    <text class="label" x="735" y="680">TIMED 双轮平均</text>
    <text class="metric" x="735" y="735">62.97 <tspan class="metric2">tok/s</tspan></text>
    <rect x="735" y="785" width="450" height="88" rx="20" fill="#FFF6F0"/>
    <text class="copy" x="759" y="822">即使手机不支持 SME2，</text>
    <text class="copy" x="759" y="852">端侧 Qwen 仍可自动降级并使用。</text>
  </g>

  <g class="sans">
    <rect x="1325" y="298" width="132" height="34" rx="17" fill="#F05A28"/>
    <text class="stage" x="1342" y="322" style="fill:#FFFFFF">决赛 Android</text>
    <text class="device" x="1325" y="382" style="fill:#FFFFFF">vivo V2509A</text>
    <text class="meta" x="1325" y="418" style="fill:#BDB5AE">MT6993 · Android 16 · 高性能</text>
    <line x1="1325" y1="455" x2="1775" y2="455" stroke="#4D4540" stroke-width="2"/>
    <text class="label" x="1325" y="500" style="fill:#AFA69F">推荐模型</text>
    <text class="value" x="1325" y="535" style="fill:#FFFFFF">Qwen3.5-4B</text>
    <text class="label" x="1325" y="590" style="fill:#AFA69F">MNN 运行路径</text>
    <text class="value" x="1325" y="625" style="fill:#FFFFFF">Backend · SME2</text>
    <text class="label" x="1325" y="680" style="fill:#AFA69F">单次实测</text>
    <text class="metric" x="1325" y="735">9.34 <tspan class="metric2" style="fill:#FFFFFF">tok/s</tspan></text>
    <rect x="1325" y="785" width="450" height="88" rx="20" fill="#312A26"/>
    <text class="copy" x="1349" y="822" style="fill:#FFFFFF">Prefill 642 ms · 总耗时 2819 ms</text>
    <text class="copy" x="1349" y="852" style="fill:#FFFFFF">高性能机型运行能力更强的 4B。</text>
  </g>

  <rect x="110" y="950" width="1700" height="74" rx="24" fill="#FFFFFF" opacity="0.88"/>
  <text class="sans foot" x="145" y="982">核心不是追求同一个最高数字，而是在模型能力、速度、内存与隐私之间做设备自适应。</text>
  <text class="sans foot" x="145" y="1009" fill="#9A8F87">注：0.5B 与 4B 的测试条件不同，token/s 不能直接解释为 SME2 加速倍率。</text>
</svg>
